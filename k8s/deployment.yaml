apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management

  template:
    metadata:
      labels:
        app: student-management

    spec:
      containers:
      - name: student-management
        image: praveensusen/student-management-system:latest

        ports:
        - containerPort: 8080